    <style>
        :root {
            --bg-dark: #0a0e14;
            --card-bg: #111823;
            --accent-cyan: #00f0ff;
            --accent-green: #00ff88;
            --accent-red: #ff3366;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --border-color: #1e293b;
            
            --brand-bc: #3bb54a;
            --brand-hq: #7f52c8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            padding: 30px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .brand-bc { color: var(--brand-bc); }
        .brand-hq { color: var(--brand-hq); }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-title i {
            font-size: 2.2rem;
            color: var(--accent-cyan);
        }

        .header-title h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            letter-spacing: 2px;
            color: #fff;
        }

        .header-subtitle {
            font-size: 0.9rem;
            color: var(--accent-cyan);
            letter-spacing: 1px;
            font-weight: 600;
        }

        .back-btn {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);

            border-radius: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;

            text-decoration: none;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: var(--accent-cyan);
            color: var(--bg-dark);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
            transform: translateY(-2px);
        }

        /* Search Container & Autocomplete Dropdown */
        .search-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            position: relative;
        }

        .search-input-wrapper {
            flex: 1;
            min-width: 280px;
            position: relative;
        }

        .search-container input {
            width: 100%;
            background: var(--bg-dark);
            color: #fff;
            border: 1px solid var(--accent-cyan);
            padding: 12px 18px;
            border-radius: 8px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            outline: none;
        }

        /* Suggestions Dropdown Box */
        .suggestions-dropdown {
            position: absolute;
            top: calc(100% + 5px);
            left: 0;
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--accent-cyan);

            z-index: 1000;
            max-height: 200px;
            overflow-y: auto;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: none;
        }

        .suggestion-item {
            padding: 10px 16px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.15s ease, color 0.15s ease;
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover {
            background: rgba(0, 240, 255, 0.1);
            color: var(--accent-cyan);
        }

        .search-btn {
            background: var(--accent-cyan);
            color: var(--bg-dark);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
            transition: opacity 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-btn:hover {
            opacity: 0.9;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        /* Section Titles */
        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            color: #fff;

            gap: 12px;

        /* Table Container */

        .header-nav { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
        .race-panel { margin-bottom: 30px; display: none; }
        .race-panel .section-title { margin-bottom: 16px; }
        .rs-note { font-family: 'Rajdhani', sans-serif; font-size: .9rem; color: var(--text-muted); letter-spacing: 0; font-weight: 600; }
        .pos-badge { font-family: 'Orbitron', sans-serif; font-size: .9rem; color: #fff; }
        .pos-badge.p1 { color: #f5a524; } .pos-badge.p2 { color: #cbd5e1; } .pos-badge.p3 { color: #cd7f32; }
        .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
        .badge { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border-color); background: rgba(255,255,255,.03); opacity: .5; }
        .badge i { font-size: 1.15rem; width: 26px; text-align: center; color: var(--text-muted); }
        .badge .b-name { display: block; font-family: 'Orbitron', sans-serif; font-size: .7rem; letter-spacing: .5px; color: #fff; }
        .badge .b-sub { display: block; font-size: .78rem; font-weight: 600; color: var(--text-muted); }
        .badge .b-bar { display: block; height: 3px; border-radius: 2px; background: rgba(255,255,255,.08); margin-top: 5px; overflow: hidden; }
        .badge .b-bar b { display: block; height: 100%; background: var(--accent-cyan); }
        .badge.earned { opacity: 1; border-color: #ffc933; background: rgba(255,201,51,.08); }
        .badge.earned i { color: #ffc933; }
        .tier { display: inline-block; font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: .62rem; letter-spacing: .5px; padding: 2px 7px; border-radius: 5px; margin-left: 8px; color: #0a0e14; vertical-align: middle; }
        .tier.Rookie { background: #94a3b8; } .tier.Club { background: #60a5fa; } .tier.Contender { background: #34d399; } .tier.Pro { background: #f5a524; } .tier.Elite { background: #c084fc; }
        .delta { font-family: 'Orbitron', sans-serif; font-size: .8rem; white-space: nowrap; }
        .delta.up { color: var(--accent-green, #00ff88); } .delta.down { color: var(--accent-red, #ff3366); } .delta.flat { color: var(--text-muted, #64748b); }
        .grade { display: inline-block; min-width: 30px; text-align: center; font-family: 'Orbitron', sans-serif; font-weight: 800; padding: 1px 8px; border-radius: 6px; color: #0a0e14; margin-right: 8px; }
        .grade.A { background: #00ff88; } .grade.B { background: #9be564; } .grade.C { background: #f5d033; } .grade.D { background: #f5a524; } .grade.E { background: #ff5577; }
        .rs-link { color: var(--accent-cyan); text-decoration: none; font-weight: 700; }
        .rs-link:hover { text-decoration: underline; }

        @media (max-width: 768px) {
            body { padding: 15px 12px; }
            .header-nav { width: 100%; display: grid; grid-template-columns: 1fr 1fr 1fr; }
            .header-nav .back-btn { justify-content: center; padding: 10px 6px; font-size: .72rem; gap: 6px; }
            .rs-hide { display: none; }
            .race-table th:last-child, .race-table td:last-child { display: table-cell; }
            .header { flex-direction: column; align-items: flex-start; gap: 15px; }
            .search-container { flex-direction: column; align-items: stretch; }
            /* Phones: let the table wrap instead of scrolling sideways, and drop the date column */
            table { white-space: normal; }
            th, td { padding: 12px 8px; font-size: .9rem; }
            th:last-child, td:last-child { display: none; }
        }

        /* ---- Shared site navigation ---- */
        a.header-title { text-decoration: none; }
        .header { flex-wrap: wrap; gap: 16px 24px; }
        .header-title h1 { font-size: 1.8rem; white-space: nowrap; }
        .nav { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
        .nav-btn { background: rgba(0,240,255,.08); border: 1px solid var(--border-color); color: var(--text-main); padding: 9px 16px; border-radius: 20px; font-family: 'Orbitron', sans-serif; font-size: .78rem; font-weight: 700; display: flex; align-items: center; gap: 8px; text-decoration: none; transition: all .2s ease; }
        .nav-btn i { color: var(--accent-cyan); }
        .nav-btn.ranked { border-color: #ffc933; background: rgba(255,201,51,.1); } .nav-btn.ranked i { color: #ffc933; } .nav-btn.ranked:hover, .nav-btn.ranked.active { border-color: #ffc933; background: rgba(255,201,51,.22); box-shadow: 0 0 12px rgba(255,201,51,.3); }
        .nav-btn:hover, .nav-btn.active { border-color: var(--accent-cyan); background: rgba(0,240,255,.15); box-shadow: 0 0 12px rgba(0,240,255,.25); }
        @media (max-width: 768px) {
            .header .nav { width: 100%; display: grid; grid-template-columns: 1fr 1fr; }
            .nav-btn { justify-content: center; padding: 10px 8px; } .nav-btn:last-child:nth-child(odd) { grid-column: 1 / -1; }
            .header-title h1 { font-size: 1.4rem; white-space: normal; }
        }
    </style>
</head>
<body>

                <h1><span class="brand-bc">BC</span><span class="brand-hq">HQ</span> DRIVER PROFILE</h1>
                <div style="font-size: 0.9rem; color: var(--accent-cyan); letter-spacing: 1px; font-weight: 600;">GLOBAL ACC LAP TIME SEARCH</div>
            </div>
        </a>
        <div class="nav">
            <a href="index.html" class="nav-btn"><i class="fa-solid fa-gauge-high"></i> HUB</a>
            <a href="driver.html" class="nav-btn active"><i class="fa-solid fa-magnifying-glass"></i> DRIVERS</a>
            <a href="races.html" class="nav-btn"><i class="fa-solid fa-flag-checkered"></i> RACES</a>
            <a href="stats.html" class="nav-btn"><i class="fa-solid fa-chart-line"></i> STATS</a>
            <a href="ranked.html" class="nav-btn ranked"><i class="fa-solid fa-ranking-star"></i> RANKED</a>
            <a href="overlay.html" class="nav-btn"><i class="fa-solid fa-tv"></i> OVERLAYS</a>
            <a href="streamers.html" class="nav-btn"><i class="fa-solid fa-users"></i> STREAMERS</a>
        </div>
    </div>

    <!-- Search Input Bar with Autocomplete Dropdown -->
    <div class="search-container">
        <div class="search-input-wrapper">
            <input type="text" id="driver-search-input" placeholder="Start typing driver name..." oninput="onDriverInput(this.value)" onkeypress="if(event.key === 'Enter') { hideSuggestions(); searchDriverRecords(); }">
            <div id="suggestions-dropdown" class="suggestions-dropdown"></div>
        </div>
        <button class="search-btn" onclick="hideSuggestions(); searchDriverRecords()">
            <i class="fa-solid fa-magnifying-glass"></i> SEARCH DRIVER
        </button>
    </div>

    <!-- Race stats (filled in from saved race results) -->
    <div id="race-panel" class="race-panel">
        <div class="section-title"><i class="fa-solid fa-flag-checkered"></i> RACE STATS <span class="rs-note" id="rs-note"></span></div>
        <div id="race-summary" class="summary-row"></div>
        <div id="rating-spark" style="display:none;max-width:420px;margin:0 0 16px"></div>
        <div id="badges-wrap" style="display:none;margin:0 0 18px">
            <div class="rs-note" id="badges-title" style="margin:0 0 10px;font-family:'Orbitron',sans-serif;font-size:.8rem;letter-spacing:1px;color:var(--text-muted)"></div>
            <div id="badges" class="badges"></div>
        </div>
        <div class="table-container" id="race-recent-wrap">
            <table class="race-table">
                <thead><tr><th>DATE</th><th>TRACK</th><th>FINISH</th><th class="rs-hide">CAR</th><th class="rs-hide">BEST LAP</th><th>RATING</th><th></th></tr></thead>
                <tbody id="race-recent"></tbody>
            </table>
        </div>
    </div>

    <!-- Results Section -->
    <div class="section-title">
        <i class="fa-solid fa-trophy"></i> ALL-TRACK PERSONAL BEST RECORDS
    </div>

    <div id="driver-summary" class="summary-row" style="display:none;"></div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>TRACK</th>
                    <th>CAR MODEL</th>
                    <th>SESSION</th>
                    <th>BEST LAP</th>
                    <th>DATE RECORDED</th>
                </tr>
            </thead>
            <tbody id="driver-results-body">
                <tr>
                    <td colspan="5" style="text-align:center; padding: 40px; color: var(--text-muted);">
                        Enter a driver name above to search records across all tracks...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Script Logic -->
    <script>
        const AZURE_API_URL = "https://acc-results-api-uk-eshycfeacuewd2b8.francecentral-01.azurewebsites.net/api/HttpTrigger1";
        let debounceTimer = null;

        const ACC_TRACK_NAMES = {
            "monza": "Monza",
            "zolder": "Zolder",
            "brands_hatch": "Brands Hatch",
            "silverstone": "Silverstone",
            "paul_ricard": "Paul Ricard",
            "misano": "Misano",
            "spa": "Circuit de Spa-Francorchamps",
            "nurburgring": "Nürburgring GP",
            "nurburgring_24h": "Nürburgring 24h (Nordschleife)",
            "barcelona": "Barcelona",
            "hungaroring": "Hungaroring",
            "zandvoort": "Zandvoort",
            "kyalami": "Kyalami",
            "mount_panorama": "Mount Panorama (Bathurst)",
            "suzuka": "Suzuka",
            "laguna_seca": "Laguna Seca",
            "imola": "Imola",
            "donington": "Donington Park",
            "oulton_park": "Oulton Park",
            "snetterton": "Snetterton",
            "cota": "Circuit of the Americas (COTA)",
            "indianapolis": "Indianapolis",
            "watkins_glen": "Watkins Glen",
            "valencia": "Valencia",
            "red_bull_ring": "Red Bull Ring"
        };

        const GT3_CAR_MODELS = {
            0: "Porsche 991 GT3 R", 1: "Mercedes-AMG GT3", 2: "Ferrari 488 GT3", 3: "Audi R8 LMS", 4: "Lamborghini Huracan GT3",
            5: "McLaren 650S GT3", 6: "Nissan GT-R Nismo GT3 2018", 7: "BMW M6 GT3", 8: "Bentley Continental GT3 2018",
            10: "Nissan GT-R Nismo GT3 2017", 11: "Bentley Continental GT3 2016", 12: "Aston Martin V12 Vantage GT3",
            13: "Lamborghini Gallardo R-EX", 14: "Jaguar G3", 15: "Lexus RC F GT3", 16: "Lamborghini Huracan Evo (2019)",
            17: "Honda NSX GT3", 19: "Audi R8 LMS Evo (2019)", 20: "AMR V8 Vantage (2019)", 21: "Honda NSX Evo (2019)",
            22: "McLaren 720S GT3 (2019)", 23: "Porsche 911II GT3 R (2019)", 24: "Ferrari 488 GT3 Evo 2020", 25: "Mercedes-AMG GT3 2020",
            30: "BMW M4 GT3", 31: "Audi R8 LMS GT3 evo II", 32: "Ferrari 296 GT3", 33: "Lamborghini Huracan Evo2",
            34: "Porsche 992 GT3 R", 35: "McLaren 720S GT3 Evo 2023", 36: "Ford Mustang GT3"
        };

        function formatLapTime(ms) {
            if (!ms || ms === 999999999 || ms <= 0) return "--:--.---";
            const min = Math.floor(ms / 60000);
            const sec = Math.floor((ms % 60000) / 1000);
            const millis = ms % 1000;
            return `${min}:${sec.toString().padStart(2, '0')}.${millis.toString().padStart(3, '0')}`;
        }

        function getTrackDisplayName(rawTrack) {
            if (!rawTrack) return "Unknown Track";
            const clean = rawTrack.toLowerCase().replace(/_\d{4}$/, '').trim();
            // Longest key first, so "nurburgring_24h" is tried before "nurburgring" (which it contains).
            const matchedKey = Object.keys(ACC_TRACK_NAMES).sort((a, b) => b.length - a.length).find(k => clean.includes(k));
            return matchedKey ? ACC_TRACK_NAMES[matchedKey] : clean.replace(/_/g, ' ').toUpperCase();
        }

        function getCarName(modelId) {
            if (modelId === undefined || modelId === null) return "GT3";
            let name = GT3_CAR_MODELS[modelId] || modelId;
            return String(name).replace(/^Car ID:\s*/i, '').trim();
        }

        function escapeHtml(str) {
            if (!str) return "";
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Arriving from a leaderboard link (driver.html?name=...): search straight away
        (function () {
            const name = new URLSearchParams(location.search).get("name");
            if (name) {
                document.getElementById("driver-search-input").value = name;
                searchDriverRecords();
            }
        })();

        // Handle Typing with Debounce for Autocomplete
        function onDriverInput(val) {
            clearTimeout(debounceTimer);
            const dropdown = document.getElementById("suggestions-dropdown");

            if (!val || val.trim().length < 2) {
                dropdown.style.display = "none";
                return;
            }

            debounceTimer = setTimeout(async () => {
                try {
                    const res = await fetch(`${AZURE_API_URL}?suggest=${encodeURIComponent(val.trim())}`);
                    const names = await res.json();

                    if (Array.isArray(names) && names.length > 0) {
                        let html = "";
                        names.forEach(name => {
                            html += `<div class="suggestion-item" onclick="selectSuggestion('${escapeHtml(name)}')">${escapeHtml(name)}</div>`;
                        });
                        dropdown.innerHTML = html;
                        dropdown.style.display = "block";
                    } else {
                        dropdown.style.display = "none";
                    }
                } catch (e) {
                    dropdown.style.display = "none";
                }
            }, 300);
        }

        function selectSuggestion(name) {
            document.getElementById("driver-search-input").value = name;
            hideSuggestions();
            searchDriverRecords();
        }

        function hideSuggestions() {
            const dropdown = document.getElementById("suggestions-dropdown");
            if (dropdown) dropdown.style.display = "none";
        }

        // Close dropdown when clicking outside
        document.addEventListener("click", function(e) {
            if (!e.target.closest(".search-input-wrapper")) {
                hideSuggestions();
            }
        });


        // Race stats for this driver (from saved race results); the panel stays hidden when there are none.
        async function loadRaceStats(name) {
            const panel = document.getElementById("race-panel");
            panel.style.display = "none";
            try {
                const res = await fetch(`${AZURE_API_URL}?type=driverstats&name=${encodeURIComponent(name)}`);
                const d = await res.json();
                if (!d || !d.found || !d.races) return;
                const tile = (v, l) => `<div class="summary-item"><strong>${escapeHtml(String(v))}</strong><span>${l}</span></div>`;   // String(): a 0 must still show
                document.getElementById("race-summary").innerHTML = [
                    tile(d.races, "RACES"), tile(d.wins, "WINS"), tile(d.podiums, "PODIUMS"),
                    tile(d.avgPos ?? "—", "AVG FINISH"), tile(d.bestPos ? "P" + d.bestPos : "—", "BEST FINISH"),
                    tile(d.points, "CHAMPIONSHIP POINTS"),
                    d.rating ? `<div class="summary-item"><strong>${escapeHtml(d.rating.value)}${d.rating.provisional ? "?" : ""}<span class="tier ${escapeHtml(d.rating.tier)}">${escapeHtml(String(d.rating.tier).toUpperCase())}</span></strong><span>RANKED RATING${d.rating.rank ? " · #" + escapeHtml(d.rating.rank) : ""}${d.rating.provisional ? " (PROVISIONAL)" : ""}</span></div>` : "",
                    d.safety ? `<div class="summary-item"><strong><span class="grade ${escapeHtml(d.safety.grade)}">${escapeHtml(d.safety.grade)}</span>${escapeHtml(d.safety.score)}</strong><span>SAFETY RATING${d.safety.provisional ? " (PROVISIONAL)" : ""}</span></div>` : "",
                    tile(d.invalidPct === null || d.invalidPct === undefined ? "—" : d.invalidPct + "%", "INVALID LAPS"),
                    tile(d.penaltiesPerRace, "PENALTIES PER RACE"),
                    tile(d.streak > 1 ? d.streak + " days" : "—", "RACING STREAK")
                ].join("");
                const spark = document.getElementById("rating-spark");
                const hist = d.rating && Array.isArray(d.rating.history) ? d.rating.history.filter(v => typeof v === "number") : [];
                if (spark) {
                    if (hist.length >= 2) {
                        const mn = Math.min(...hist), mx = Math.max(...hist), W = 320, H = 54, rng = Math.max(1, mx - mn);
                        const pts = hist.map((v, i) => `${(i / (hist.length - 1) * (W - 8) + 4).toFixed(1)},${(H - 6 - (v - mn) / rng * (H - 12)).toFixed(1)}`).join(" ");
                        spark.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" role="img" aria-label="Rating over recent races"><polyline fill="none" stroke="#00f0ff" stroke-width="2" points="${pts}"/></svg><div style="color:var(--text-muted);font-size:.8rem;font-weight:600">Rating over the last ${hist.length} races (${mn} to ${mx})</div>`;
                        spark.style.display = "block";
                    } else { spark.style.display = "none"; }
                }
                const bw = document.getElementById("badges-wrap");
                const ach = Array.isArray(d.achievements) ? d.achievements : [];
                if (bw && ach.length) {
                    const got = ach.filter(a => a.earned);
                    document.getElementById("badges-title").textContent = `ACHIEVEMENTS · ${got.length} OF ${ach.length}`;
                    const sorted = [...got, ...ach.filter(a => !a.earned)];
                    document.getElementById("badges").innerHTML = sorted.map(a => {
                        const pct = Math.max(0, Math.min(100, Math.round(a.value / a.goal * 100)));
                        const sub = a.earned ? escapeHtml(a.desc) : `${escapeHtml(a.desc)}<span class="b-bar"><b style="width:${pct}%"></b></span>`;
                        return `<div class="badge ${a.earned ? "earned" : ""}" title="${escapeHtml(a.desc)}${a.earned ? "" : " (" + escapeHtml(a.value) + "/" + escapeHtml(a.goal) + ")"}"><i class="fa-solid fa-${escapeHtml(a.icon)}"></i><span><span class="b-name">${escapeHtml(a.name.toUpperCase())}</span><span class="b-sub">${sub}</span></span></div>`;
                    }).join("");
                    bw.style.display = "block";
                } else if (bw) { bw.style.display = "none"; }
                document.getElementById("rs-note").textContent = d.cars && d.cars[0] ? "Most raced car: " + d.cars[0].car : "";
                const rows = (d.recentRaces || []).map(r => {
                    const p = r.pos ? `<span class="pos-badge ${r.pos <= 3 ? "p" + r.pos : ""}">P${r.pos}</span> <span style="color:var(--text-muted)">of ${escapeHtml(r.entries)}</span>` : "—";
                    return `<tr>
                        <td>${escapeHtml(new Date(r.date).toLocaleDateString())}</td>
                        <td style="font-family:'Orbitron',sans-serif;color:#fff;">${escapeHtml(getTrackDisplayName(r.track))}</td>
                        <td>${p}</td>
                        <td class="rs-hide"><span class="car-badge">${escapeHtml(r.car || "GT3")}</span></td>
                        <td class="rs-hide lap-time">${formatLapTime(r.bestMs)}</td>
                        <td>${typeof r.delta === "number" ? `<span class="delta ${r.delta > 0 ? "up" : r.delta < 0 ? "down" : "flat"}">${r.delta > 0 ? "+" : ""}${escapeHtml(r.delta)}</span>` : "—"}</td>
                        <td><a class="rs-link" href="races.html?race=${encodeURIComponent(r.id)}">RESULTS</a></td>
                    </tr>`;
                });
                document.getElementById("race-recent").innerHTML = rows.join("");
                document.getElementById("race-recent-wrap").style.display = rows.length ? "" : "none";
                panel.style.display = "block";
            } catch (e) { /* race stats are optional */ }
        }

        async function searchDriverRecords() {
            const queryInput = document.getElementById("driver-search-input").value.trim();
            const tbody = document.getElementById("driver-results-body");
            if (!queryInput) return;

            document.getElementById("race-panel").style.display = "none";
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 40px; color: var(--accent-cyan);"><i class="fa-solid fa-circle-notch fa-spin"></i> Searching database for driver "${escapeHtml(queryInput)}"...</td></tr>`;

            try {
                const res = await fetch(`${AZURE_API_URL}?driver=${encodeURIComponent(queryInput)}`);
                const records = await res.json();

                if (!Array.isArray(records) || records.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 40px; color: var(--text-muted);">No records found for driver "${escapeHtml(queryInput)}".</td></tr>`;
                    return;
                }

                // The API does a "contains" search; if someone's name matches exactly, show only them.
                const exact = records.filter(r => String(r.driverName || "").toLowerCase() === queryInput.toLowerCase());
                if (exact.length) records.splice(0, records.length, ...exact);

                records.sort((a, b) => getTrackDisplayName(a.track).localeCompare(getTrackDisplayName(b.track)));

                let html = "";
                records.forEach(record => {
                    const trackName = getTrackDisplayName(record.track);
                    html += `
                        <tr>
                            <td style="font-family: 'Orbitron', sans-serif; color: #fff;">${escapeHtml(trackName)}</td>
                            <td><span class="car-badge">${escapeHtml(getCarName(record.carModel))}</span></td>
                            <td>${escapeHtml(record.sessionType || 'Race')}</td>
                            <td class="lap-time">${formatLapTime(record.bestLapMs)}</td>
                            <td>${record.lastUpdated ? new Date(record.lastUpdated).toLocaleDateString() : '—'}</td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;

                // Summary: tracks, favourite car (most records), latest record
                const trackSet = new Set(records.map(r => getTrackDisplayName(r.track)));
                const carCounts = {};
                records.forEach(r => { const c = getCarName(r.carModel); carCounts[c] = (carCounts[c] || 0) + 1; });
                const favCar = Object.entries(carCounts).sort((a, b) => b[1] - a[1])[0][0];
                const latest = records.map(r => r.lastUpdated).filter(Boolean).sort().pop();
                const summary = document.getElementById("driver-summary");
                summary.innerHTML = `
                    <div class="summary-item"><strong>${escapeHtml(records[0].driverName || queryInput)}</strong><span>DRIVER</span></div>
                    <div class="summary-item"><strong>${trackSet.size}</strong><span>TRACKS WITH A RECORD</span></div>
                    <div class="summary-item"><strong>${escapeHtml(favCar)}</strong><span>MOST USED CAR</span></div>
                    <div class="summary-item"><strong>${latest ? new Date(latest).toLocaleDateString() : '—'}</strong><span>LATEST RECORD</span></div>`;
                summary.style.display = "flex";
                loadRaceStats(records[0].driverName || queryInput);

            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 40px; color: var(--accent-red);">Failed to retrieve records from Azure database.</td></tr>`;
            }
        }
    </script>
