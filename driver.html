<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com;
        style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com;
        font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com;
        img-src 'self' https://cdn.jsdelivr.net data:;
        connect-src 'self' https://acc-results-api-uk-eshycfeacuewd2b8.francecentral-01.azurewebsites.net https://api.github.com;
    ">
    
    <title>BCHQ HUB - Driver Track Records Search</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0a0e14;
            --card-bg: #111823;
            --accent-cyan: #00f0ff;
            --accent-green: #00ff88;
            --accent-red: #ff3366;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --border-color: #1e293b;
            
            --brand-bc: #3bb54a;
            --brand-hq: #7f52c8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            padding: 30px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .brand-bc { color: var(--brand-bc); }
        .brand-hq { color: var(--brand-hq); }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-title i {
            font-size: 2.2rem;
            color: var(--accent-cyan);
        }

        .header-title h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            letter-spacing: 2px;
            color: #fff;
        }

        .header-subtitle {
            font-size: 0.9rem;
            color: var(--accent-cyan);
            letter-spacing: 1px;
            font-weight: 600;
        }

        .back-btn {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 10px 20px;
            border-radius: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: var(--accent-cyan);
            color: var(--bg-dark);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
            transform: translateY(-2px);
        }

        /* Search Container & Autocomplete Dropdown */
        .search-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            position: relative;
        }

        .search-input-wrapper {
            flex: 1;
            min-width: 280px;
            position: relative;
        }

        .search-container input {
            width: 100%;
            background: var(--bg-dark);
            color: #fff;
            border: 1px solid var(--accent-cyan);
            padding: 12px 18px;
            border-radius: 8px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            outline: none;
        }

        /* Suggestions Dropdown Box */
        .suggestions-dropdown {
            position: absolute;
            top: calc(100% + 5px);
            left: 0;
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--accent-cyan);
            border-radius: 8px;
            z-index: 1000;
            max-height: 200px;
            overflow-y: auto;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: none;
        }

        .suggestion-item {
            padding: 10px 16px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.15s ease, color 0.15s ease;
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover {
            background: rgba(0, 240, 255, 0.1);
            color: var(--accent-cyan);
        }

        .search-btn {
            background: var(--accent-cyan);
            color: var(--bg-dark);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
            transition: opacity 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-btn:hover {
            opacity: 0.9;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        /* Section Titles */
        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            color: #fff;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 1px;
        }

        .section-title i { color: var(--accent-cyan); }

        /* Table Container */
        .table-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            white-space: nowrap;
        }

        th {
            background-color: rgba(0, 0, 0, 0.3);
            color: var(--text-muted);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            font-size: 1.05rem;
            font-weight: 600;
        }

        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: rgba(0, 240, 255, 0.03); }

        .car-badge {
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .lap-time {
            font-family: 'Orbitron', sans-serif;
            color: var(--accent-green);
        }

        @media (max-width: 768px) {
            body { padding: 15px 12px; }
            .header { flex-direction: column; align-items: flex-start; gap: 15px; }
            .search-container { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="header-title">
            <i class="fa-solid fa-user-astronaut"></i>
            <div>
                <h1><span class="brand-bc">BC</span><span class="brand-hq">HQ</span> DRIVER PROFILE</h1>
                <div class="header-subtitle">GLOBAL ACC LAP TIME SEARCH</div>
            </div>
        </div>
        <a href="index.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i> BACK TO HUB
        </a>
    </div>

    <!-- Search Input Bar with Autocomplete Dropdown -->
    <div class="search-container">
        <div class="search-input-wrapper">
            <input type="text" id="driver-search-input" placeholder="Start typing driver name..." oninput="onDriverInput(this.value)" onkeypress="if(event.key === 'Enter') { hideSuggestions(); searchDriverRecords(); }">
            <div id="suggestions-dropdown" class="suggestions-dropdown"></div>
        </div>
        <button class="search-btn" onclick="hideSuggestions(); searchDriverRecords()">
            <i class="fa-solid fa-magnifying-glass"></i> SEARCH DRIVER
        </button>
    </div>

    <!-- Results Section -->
    <div class="section-title">
        <i class="fa-solid fa-trophy"></i> ALL-TRACK PERSONAL BEST RECORDS
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>TRACK</th>
                    <th>CAR MODEL</th>
                    <th>SESSION</th>
                    <th>BEST LAP</th>
                    <th>DATE RECORDED</th>
                </tr>
            </thead>
            <tbody id="driver-results-body">
                <tr>
                    <td colspan="5" style="text-align:center; padding: 40px; color: var(--text-muted);">
                        Enter a driver name above to search records across all tracks...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Script Logic -->
    <script>
        const AZURE_API_URL = "https://acc-results-api-uk-eshycfeacuewd2b8.francecentral-01.azurewebsites.net/api/HttpTrigger1";
        let debounceTimer = null;

        const ACC_TRACK_NAMES = {
            "monza": "Monza",
            "zolder": "Zolder",
            "brands_hatch": "Brands Hatch",
            "silverstone": "Silverstone",
            "paul_ricard": "Paul Ricard",
            "misano": "Misano",
            "spa": "Circuit de Spa-Francorchamps",
            "nurburgring": "Nürburgring GP",
            "nurburgring_24h": "Nürburgring 24h (Nordschleife)",
            "barcelona": "Barcelona",
            "hungaroring": "Hungaroring",
            "zandvoort": "Zandvoort",
            "kyalami": "Kyalami",
            "mount_panorama": "Mount Panorama (Bathurst)",
            "suzuka": "Suzuka",
            "laguna_seca": "Laguna Seca",
            "imola": "Imola",
            "donington": "Donington Park",
            "oulton_park": "Oulton Park",
            "snetterton": "Snetterton",
            "cota": "Circuit of the Americas (COTA)",
            "indianapolis": "Indianapolis",
            "watkins_glen": "Watkins Glen",
            "valencia": "Valencia",
            "red_bull_ring": "Red Bull Ring"
        };

        const GT3_CAR_MODELS = {
            0: "Porsche 991 GT3 R", 1: "Mercedes-AMG GT3", 2: "Ferrari 488 GT3", 3: "Audi R8 LMS", 4: "Lamborghini Huracan GT3",
            5: "McLaren 650S GT3", 6: "Nissan GT-R Nismo GT3 2018", 7: "BMW M6 GT3", 8: "Bentley Continental GT3 2018",
            10: "Nissan GT-R Nismo GT3 2017", 11: "Bentley Continental GT3 2016", 12: "Aston Martin V12 Vantage GT3",
            13: "Lamborghini Gallardo R-EX", 14: "Jaguar G3", 15: "Lexus RC F GT3", 16: "Lamborghini Huracan Evo (2019)",
            17: "Honda NSX GT3", 19: "Audi R8 LMS Evo (2019)", 20: "AMR V8 Vantage (2019)", 21: "Honda NSX Evo (2019)",
            22: "McLaren 720S GT3 (2019)", 23: "Porsche 911II GT3 R (2019)", 24: "Ferrari 488 GT3 Evo 2020", 25: "Mercedes-AMG GT3 2020",
            30: "BMW M4 GT3", 31: "Audi R8 LMS GT3 evo II", 32: "Ferrari 296 GT3", 33: "Lamborghini Huracan Evo2",
            34: "Porsche 992 GT3 R", 35: "McLaren 720S GT3 Evo 2023", 36: "Ford Mustang GT3"
        };

        function formatLapTime(ms) {
            if (!ms || ms === 999999999 || ms <= 0) return "--:--.---";
            const min = Math.floor(ms / 60000);
            const sec = Math.floor((ms % 60000) / 1000);
            const millis = ms % 1000;
            return `${min}:${sec.toString().padStart(2, '0')}.${millis.toString().padStart(3, '0')}`;
        }

        function getTrackDisplayName(rawTrack) {
            if (!rawTrack) return "Unknown Track";
            const clean = rawTrack.toLowerCase().replace(/_\d{4}$/, '').trim();
            const matchedKey = Object.keys(ACC_TRACK_NAMES).find(k => clean.includes(k));
            return matchedKey ? ACC_TRACK_NAMES[matchedKey] : clean.replace(/_/g, ' ').toUpperCase();
        }

        function getCarName(modelId) {
            if (modelId === undefined || modelId === null) return "GT3";
            let name = GT3_CAR_MODELS[modelId] || modelId;
            return String(name).replace(/^Car ID:\s*/i, '').trim();
        }

        function escapeHtml(str) {
            if (!str) return "";
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Handle Typing with Debounce for Autocomplete
        function onDriverInput(val) {
            clearTimeout(debounceTimer);
            const dropdown = document.getElementById("suggestions-dropdown");

            if (!val || val.trim().length < 2) {
                dropdown.style.display = "none";
                return;
            }

            debounceTimer = setTimeout(async () => {
                try {
                    const res = await fetch(`${AZURE_API_URL}?suggest=${encodeURIComponent(val.trim())}`);
                    const names = await res.json();

                    if (Array.isArray(names) && names.length > 0) {
                        let html = "";
                        names.forEach(name => {
                            html += `<div class="suggestion-item" onclick="selectSuggestion('${escapeHtml(name)}')">${escapeHtml(name)}</div>`;
                        });
                        dropdown.innerHTML = html;
                        dropdown.style.display = "block";
                    } else {
                        dropdown.style.display = "none";
                    }
                } catch (e) {
                    dropdown.style.display = "none";
                }
            }, 300);
        }

        function selectSuggestion(name) {
            document.getElementById("driver-search-input").value = name;
            hideSuggestions();
            searchDriverRecords();
        }

        function hideSuggestions() {
            const dropdown = document.getElementById("suggestions-dropdown");
            if (dropdown) dropdown.style.display = "none";
        }

        // Close dropdown when clicking outside
        document.addEventListener("click", function(e) {
            if (!e.target.closest(".search-input-wrapper")) {
                hideSuggestions();
            }
        });

        async function searchDriverRecords() {
            const queryInput = document.getElementById("driver-search-input").value.trim();
            const tbody = document.getElementById("driver-results-body");
            if (!queryInput) return;

            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 40px; color: var(--accent-cyan);"><i class="fa-solid fa-circle-notch fa-spin"></i> Searching database for driver "${escapeHtml(queryInput)}"...</td></tr>`;

            try {
                const res = await fetch(`${AZURE_API_URL}?driver=${encodeURIComponent(queryInput)}`);
                const records = await res.json();

                if (!Array.isArray(records) || records.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 40px; color: var(--text-muted);">No records found for driver "${escapeHtml(queryInput)}".</td></tr>`;
                    return;
                }

                records.sort((a, b) => getTrackDisplayName(a.track).localeCompare(getTrackDisplayName(b.track)));

                let html = "";
                records.forEach(record => {
                    const trackName = getTrackDisplayName(record.track);
                    html += `
                        <tr>
                            <td style="font-family: 'Orbitron', sans-serif; color: #fff;">${escapeHtml(trackName)}</td>
                            <td><span class="car-badge">${escapeHtml(getCarName(record.carModel))}</span></td>
                            <td>${escapeHtml(record.sessionType || 'Race')}</td>
                            <td class="lap-time">${formatLapTime(record.bestLapMs)}</td>
                            <td>${record.lastUpdated ? new Date(record.lastUpdated).toLocaleDateString() : '—'}</td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;

            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 40px; color: var(--accent-red);">Failed to retrieve records from Azure database.</td></tr>`;
            }
        }
    </script>
    <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "02a093a4e8134646a50f03a68676c5c8"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
