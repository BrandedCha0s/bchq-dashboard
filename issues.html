<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCHQ HUB - Report Issue</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0a0e14;
            --card-bg: #111823;
            --accent-cyan: #00f0ff;
            --accent-green: #00ff88;
            --accent-red: #ff3366;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --border-color: #1e293b;
            --brand-bc: #3bb54a;
            --brand-hq: #7f52c8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            padding: 30px 20px;
            max-width: 900px;
            margin: 0 auto;
            line-height: 1.6;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
        }
        .header-title h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: #fff;
            letter-spacing: 2px;
        }
        .brand-bc { color: var(--brand-bc); }
        .brand-hq { color: var(--brand-hq); }

        .back-btn {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 10px 20px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }
        .back-btn:hover {
            background: var(--accent-cyan);
            color: var(--bg-dark);
        }

        .content-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
        }

        h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--accent-red);
            font-size: 1.3rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        p {
            color: var(--text-main);
            font-size: 1.05rem;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        input, textarea {
            background-color: var(--bg-dark);
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 8px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.05rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        input:focus, textarea:focus {
            border-color: var(--accent-red);
        }

        textarea {
            resize: vertical;
            min-height: 140px;
        }

        .submit-btn {
            background: rgba(255, 51, 102, 0.15);
            border: 1px solid var(--accent-red);
            color: #fff;
            padding: 14px 28px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.2);
        }

        .submit-btn:hover {
            background: var(--accent-red);
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.6);
            transform: translateY(-2px);
        }

        .alert-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            display: none;
        }

        .alert-box.success {
            background: rgba(0, 255, 136, 0.15);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            display: block;
        }

        .alert-box.error {
            background: rgba(255, 51, 102, 0.15);
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
            display: block;
        }
        /* --- ADD MOBILE MEDIA QUERY HERE --- */
        @media (max-width: 768px) {
            body {
                padding: 15px 10px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .header > div:last-child {
                width: 100%;
                justify-content: space-between;
            }

            .leaderboard-controls {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }

            .leaderboard-controls select {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="header-title">
            <i class="fa-solid fa-gauge-high" style="font-size: 2.2rem; color: var(--accent-cyan);"></i>
            <div>
                <h1><span class="brand-bc">BC</span><span class="brand-hq">HQ</span> HUB</h1>
                <div style="font-size: 0.9rem; color: var(--accent-cyan); letter-spacing: 1px; font-weight: 600;">ISSUE TRACKER</div>
            </div>
        </a>
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> BACK TO HUB</a>
    </div>

    <div class="content-card">
        <h2><i class="fa-solid fa-bug"></i> Report a Bug or Issue</h2>
        <p>Found a problem with telemetry polling, server cards, or leaderboards? Fill out the form below, and it will be logged directly to our GitHub issue tracker.</p>
        
        <form id="issue-form" onsubmit="submitIssue(event)">
            <div class="form-group">
                <label for="issue-title">ISSUE TITLE</label>
                <input type="text" id="issue-title" placeholder="e.g., Leaderboard gap calculation incorrect for Monza" required>
            </div>

            <div class="form-group">
                <label for="issue-desc">DESCRIPTION & STEPS TO REPRODUCE</label>
                <textarea id="issue-desc" placeholder="Describe what went wrong, what you expected to happen, and how we can reproduce it..." required></textarea>
            </div>

            <button type="submit" id="submit-btn" class="submit-btn">
                <i class="fa-solid fa-paper-plane"></i> SUBMIT TO GITHUB
            </button>
        </form>

        <div id="alert-container"></div>
    </div>

    <script>
        const AZURE_API_URL = "https://acc-results-api-uk-eshycfeacuewd2b8.francecentral-01.azurewebsites.net/api/HttpTrigger1";

        let lastSubmissionTime = 0;
        const COOLDOWN_PERIOD = 30000; // 30 seconds cooldown

        async function submitIssue(event) {
            event.preventDefault();
            const titleInput = document.getElementById("issue-title");
            const descInput = document.getElementById("issue-desc");
            const submitBtn = document.getElementById("submit-btn");
            const alertContainer = document.getElementById("alert-container");

            const now = Date.now();
            if (now - lastSubmissionTime < COOLDOWN_PERIOD) {
                const remaining = Math.ceil((COOLDOWN_PERIOD - (now - lastSubmissionTime)) / 1000);
                alertContainer.className = "alert-box error";
                alertContainer.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Please wait ${remaining} seconds before submitting another issue.`;
                return;
            }

            const title = titleInput.value.trim();
            const description = descInput.value.trim();

            if (!title || !description) return;

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> SUBMITTING...`;
            alertContainer.innerHTML = "";

            try {
                const response = await fetch(`${AZURE_API_URL}?type=issue`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ title, description })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    lastSubmissionTime = Date.now(); // Set cooldown timestamp on success
                    alertContainer.className = "alert-box success";
                    alertContainer.innerHTML = `<i class="fa-solid fa-check-circle"></i> Issue successfully created on GitHub! <a href="${data.issueUrl}" target="_blank" style="color: #fff; text-decoration: underline; margin-left: 5px;">View Issue #${data.issueUrl.split('/').pop()}</a>`;
                    titleInput.value = "";
                    descInput.value = "";
                } else {
                    throw new Error(data.error || "Failed to submit issue.");
                }
            } catch (err) {
                alertContainer.className = "alert-box error";
                alertContainer.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Error: ${err.message}`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> SUBMIT TO GITHUB`;
            }
        }
    </script>
    <!-- Footer Legal Section -->
    <div style="margin-top: 60px; padding-top: 20px; border-top: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; color: var(--text-muted); font-size: 0.9rem; flex-wrap: wrap; gap: 15px;">
        <div>
            &copy; 2026 <span class="brand-bc">BC</span><span class="brand-hq">HQ</span> HUB. Independent community platform.
        </div>
        <div style="display: flex; gap: 20px;">
            <a href="legal.html" style="color: var(--text-muted); text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='var(--accent-cyan)'" onmouseout="this.style.color='var(--text-muted)'">Terms & Disclaimers</a>
        </div>
    </div>
</body>
</html>
