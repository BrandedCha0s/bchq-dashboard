<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCHQ HUB - Live ACC Telemetry & Leaderboards</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0a0e14;
            --card-bg: #111823;
            --accent-cyan: #00f0ff;
            --accent-green: #00ff88;
            --accent-red: #ff3366;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --border-color: #1e293b;
            
            /* BCHQ Brand & Social Colors */
            --brand-bc: #3bb54a;
            --brand-hq: #7f52c8;
            --discord-blurple: #5865f2;
            --twitch-purple: #9146FF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            padding: 30px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* BCHQ Text Styling */
        .brand-bc {
            color: var(--brand-bc);
        }

        .brand-hq {
            color: var(--brand-hq);
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-title i {
            font-size: 2.2rem;
            color: var(--accent-cyan);
        }

        .header-title h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            letter-spacing: 2px;
            color: #fff;
        }

        .header-subtitle {
            font-size: 0.9rem;
            color: var(--accent-cyan);
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* Header Buttons Base Style */
        .discord-btn-header {
            background: rgba(88, 101, 242, 0.15);
            border: 1px solid var(--discord-blurple);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .discord-btn-header i {
            font-size: 1.1rem;
            color: var(--discord-blurple);
            transition: color 0.2s ease;
        }

        .discord-btn-header:hover {
            background: var(--discord-blurple);
            color: #fff;
            box-shadow: 0 0 15px rgba(88, 101, 242, 0.5);
            transform: translateY(-2px);
        }

        .discord-btn-header:hover i {
            color: #fff;
        }

        /* Twitch Button Theme */
        .twitch-btn-header {
            background: rgba(145, 70, 255, 0.15);
            border: 1px solid var(--twitch-purple);
            color: #fff;
        }
        .twitch-btn-header i {
            color: var(--twitch-purple);
        }
        .twitch-btn-header:hover {
            background: var(--twitch-purple);
            box-shadow: 0 0 15px rgba(145, 70, 255, 0.5);
            transform: translateY(-2px);
            color: #fff;
        }
        .twitch-btn-header:hover i {
            color: #fff;
        }

        /* Section Titles */
        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            color: #fff;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 1px;
        }

        .section-title i {
            color: var(--accent-cyan);
        }

        /* Server Cards Grid */
        .servers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .server-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, border-color 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .server-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-cyan);
        }
