<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCHQ HUB - Live ACC Telemetry & Leaderboards</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0a0e14;
            --card-bg: #111823;
            --accent-cyan: #00f0ff;
            --accent-green: #00ff88;
            --accent-red: #ff3366;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --border-color: #1e293b;
            
            /* BCHQ Brand & Discord Colors */
            --brand-bc: #3bb54a;
            --brand-hq: #7f52c8;
            --discord-blurple: #5865f2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            padding: 30px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* BCHQ Text Styling */
        .brand-bc {
            color: var(--brand-bc);
        }

        .brand-hq {
            color: var(--brand-hq);
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-title i {
            font-size: 2.2rem;
            color: var(--accent-cyan);
        }

        .header-title h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            letter-spacing: 2px;
            color: #fff;
        }

        .header-subtitle {
            font-size: 0.9rem;
            color: var(--accent-cyan);
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* Discord Button Header Badge */
        .discord-btn-header {
            background: rgba(88, 101, 242, 0.15);
            border: 1px solid var(--discord-blurple);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .discord-btn-header i {
            font-size: 1.1rem;
            color: var(--discord-blurple);
            transition: color 0.2s ease;
        }

        .discord-btn-header:hover {
            background: var(--discord-blurple);
            color: #fff;
            box-shadow: 0 0 15px rgba(88, 101, 242, 0.5);
            transform: translateY(-2px);
        }

        .discord-btn-header:hover i {
            color: #fff;
        }

        /* Section Titles */
        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            color: #fff;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 1px;
        }

        .section-title i {
            color: var(--accent-cyan);
        }

        /* Server Cards Grid */
        .servers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .server-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, border-color 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .server-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-cyan);
        }

        .server-card.offline {
            opacity: 0.6;
        }

        .server-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .server-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 5px;
        }

        .server-track {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .copy-btn {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .copy-btn:hover {
            background: var(--accent-cyan);
            color: var(--bg-dark);
        }

        .track-map-container {
            width: 100%;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 10px;
        }

        .track-map-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.3));
        }

        .server-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
            font-size: 0.95rem;
        }

        .meta-item {
            display: flex;
            flex-direction: column;
        }

        .meta-label {
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .meta-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
        }

        /* Leaderboard Controls */
        .leaderboard-controls {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .select-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        select {
            background-color: var(--bg-dark);
            color: #fff;
            border: 1px solid var(--accent-cyan);
            padding: 10px 16px;
            border-radius: 8px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            min-width: 250px;
        }

        /* Leaderboard Table */
        .table-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: rgba(0, 0, 0, 0.3);
            color: var(--text-muted);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            font-size: 1.05rem;
            font-weight: 600;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: rgba(0, 240, 255, 0.03);
        }

        .rank-column {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            color: var(--accent-cyan);
            width: 80px;
        }

        .rank-1 { color: #ffd700; }
        .rank-2 { color: #c0c0c0; }
        .rank-3 { color: #cd7f32; }

        .driver-name {
            color: #fff;
        }

        .car-badge {
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .lap-time {
            font-family: 'Orbitron', sans-serif;
            color: var(--accent-green);
        }

        .gap-cell {
            font-family: 'Orbitron', sans-serif;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Toast Popup */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--accent-green);
            color: var(--bg-dark);
            padding: 12px 24px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.4);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="header-title">
            <i class="fa-solid fa-gauge-high"></i>
            <div>
                <h1><span class="brand-bc">BC</span><span class="brand-hq">HQ</span> HUB</h1>
                <div class="header-subtitle">LIVE ACCWEB TELEMETRY & ALL-TRACK LEADERBOARDS</div>
            </div>
        </div>
        
        <!-- Discord Link Header Button -->
        <a href="https://discord.gg/SmvcXeXdyS" target="_blank" rel="noopener noreferrer" class="discord-btn-header">
            <i class="fa-brands fa-discord"></i> JOIN OUR DISCORD
        </a>

        <select id="track-select" onchange="onTrackChange(this.value)">

    <div class="table-container">
        <table>

                <tr>
                    <th class="rank-column">POS</th>

            </thead>
            <tbody id="leaderboard-body">

                    <td colspan="6" style="text-align:center; padding: 30px; color: var(--text-muted);">

    <!-- Notification Toast -->
    <div id="toast" class="toast">
        <i class="fa-solid fa-check-circle"></i> Server Name Copied!
    </div>

    <script>
        // Azure Function Endpoint URL
        const AZURE_API_URL = "https://acc-results-api-uk-eshycfeacuewd2b8.francecentral-01.azurewebsites.net/api/HttpTrigger1?code=dygP7L_WKrHHvJQOxFSAScfaR-fRsxQ2ER6m-GO6yJ4yAzFutiTwyg==";

        // Target repository tracks folder via jsDelivr CDN (.png format)
        const ASSET_PATH = "https://cdn.jsdelivr.net/gh/BrandedCha0s/bchq-dashboard@main/tracks/";

        // Master 25-Track Mapping Dictionary
        const ACC_TRACK_NAMES = {
            "monza": "Autodromo Nazionale Monza",
            "zolder": "Circuit Zolder",
            "brands_hatch": "Brands Hatch",
            "silverstone": "Silverstone Circuit",
            "paul_ricard": "Circuit Paul Ricard",
            "misano": "Misano World Circuit",
            "spa": "Circuit de Spa-Francorchamps",
            "nurburgring": "Nürburgring GP",
            "nurburgring_24h": "Nürburgring 24h (Nordschleife)",
            "nordschleife": "Nürburgring 24h (Nordschleife)",
            "barcelona": "Circuit de Barcelona-Catalunya",
            "hungaroring": "Hungaroring",
            "zandvoort": "Circuit Zandvoort",
            "kyalami": "Kyalami Grand Prix Circuit",
            "mount_panorama": "Mount Panorama (Bathurst)",
            "bathurst": "Mount Panorama (Bathurst)",
            "suzuka": "Suzuka Circuit",
            "laguna_seca": "WeatherTech Raceway Laguna Seca",
            "imola": "Autodromo Enzo e Dino Ferrari (Imola)",
            "donington": "Donington Park",
            "oulton_park": "Oulton Park",
            "snetterton": "Snetterton Circuit",
            "cota": "Circuit of the Americas (COTA)",
            "indianapolis": "Indianapolis Motor Speedway",
            "watkins_glen": "Watkins Glen International",
            "valencia": "Circuit Ricardo Tormo (Valencia)",
            "red_bull_ring": "Red Bull Ring"
        };

        // Safely escapes HTML special characters to prevent parser breaks
        function escapeHtml(str) {
            if (!str) return "";
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        // Formats "BCHQ" inside text with brand colors safely
        function formatBCHQText(text) {
            if (!text) return "";
            const safeText = escapeHtml(text);
            return safeText.replace(/BCHQ/g, '<span class="brand-bc">BC</span><span class="brand-hq">HQ</span>');
        }

        function getTrackFileName(rawTrackKey) {
            if (!rawTrackKey) return "nurburgring.png";
            const cleanKey = rawTrackKey.toLowerCase().replace(/_\d{4}$/, '').trim();
            const matchedKey = Object.keys(ACC_TRACK_NAMES).find(k => cleanKey.includes(k));
            return matchedKey ? `${matchedKey}.png` : `${cleanKey}.png`;
        }

        function getTrackDisplayName(rawTrackKey) {
            if (!rawTrackKey) return "NÜRBURGRING GP";
            const cleanKey = rawTrackKey.toLowerCase().replace(/_\d{4}$/, '').trim();
            const matchedKey = Object.keys(ACC_TRACK_NAMES).find(k => cleanKey.includes(k));
            return matchedKey ? ACC_TRACK_NAMES[matchedKey] : cleanKey.replace(/_/g, ' ').toUpperCase();
        }

        function formatLapTime(ms) {
            if (!ms || ms === 999999999 || ms <= 0) return "--:--.---";
            const min = Math.floor(ms / 60000);
            const sec = Math.floor((ms % 60000) / 1000);
            const millis = ms % 1000;
            return `${min}:${sec.toString().padStart(2, '0')}.${millis.toString().padStart(3, '0')}`;
        }

        // Fetch Live Server Instances with background update & sorting support
        async function loadLiveServers(isBackground = false) {
            const container = document.getElementById("servers-container");
            if (!container) return;

            if (!isBackground && (!container.children.length || container.innerHTML.includes("Fetching"))) {
                container.innerHTML = `<div style="color: var(--text-muted); padding: 20px;">
                    <i class="fa-solid fa-circle-notch fa-spin"></i> Fetching live server instances...
                </div>`;
            }

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 12000);

                const response = await fetch(`${AZURE_API_URL}&type=servers`, {
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                const data = await response.json();

                if (!response.ok || data.error) {
                    if (!isBackground) {
                        container.innerHTML = `<div style="color: var(--accent-red); padding: 20px;">
                            <i class="fa-solid fa-triangle-exclamation"></i> ${data.error || 'Could not connect to ACCWeb instance API.'}
                        </div>`;
                    }
                    return;
                }

                const instances = Array.isArray(data) ? data : (data.instances || []);

                if (instances.length === 0) {
                    container.innerHTML = `<div style="color: var(--text-muted); padding: 20px;">No active ACCWeb servers running.</div>`;
                    return;
                }

                // SORTING LOGIC: Orders servers #1 (or unnumbered main), #2, #3...
                function getServerOrderNumber(name) {
                    if (!name) return 999;
                    const match = name.match(/#(\d+)/);
                    if (match) return parseInt(match[1], 10);
                    if (name.toUpperCase().includes("BCHQ")) return 1;
                    return 999;
                }

                instances.sort((a, b) => {
                    const orderA = getServerOrderNumber(a.name);
                    const orderB = getServerOrderNumber(b.name);
                    if (orderA !== orderB) return orderA - orderB;
                    return (a.name || "").localeCompare(b.name || "");
                });

                let html = "";
                instances.forEach(inst => {
                    const serverName = inst.name || "ACC Server";
                    const formattedTitle = formatBCHQText(serverName);
                    const rawTrack = inst.track || "nurburgring";
                    const maxSlots = inst.maxSlots || 20;
                    const isOnline = Boolean(inst.isOnline);

                    const fileName = getTrackFileName(rawTrack);
                    const displayName = getTrackDisplayName(rawTrack);
                    const trackImgUrl = `${ASSET_PATH}${fileName}?v=1.1`;

                    html += `
                        <div class="server-card ${isOnline ? '' : 'offline'}">
                            <div class="server-header">
                                <div>
                                    <div class="server-title">${formattedTitle}</div>
                                    <div class="server-track"><i class="fa-solid fa-location-dot"></i> ${escapeHtml(displayName).toUpperCase()}</div>
                                </div>
                                <button class="copy-btn" data-name="${escapeHtml(serverName)}" onclick="copyServerName(this)">
                                    <i class="fa-regular fa-copy"></i> Copy Name
                                </button>
                            </div>
                            <div class="track-map-container">
                                <img class="track-map-img" 
                                     src="${trackImgUrl}" 
                                     alt="${escapeHtml(displayName)}" 
                                     onerror="this.onerror=null; this.src='${ASSET_PATH}nurburgring.png?v=1.1';" />
                            </div>
                            <div class="server-meta">
                                <div class="meta-item">
                                    <span class="meta-label">Status</span>
                                    <span class="meta-value" style="color: ${isOnline ? 'var(--accent-green)' : 'var(--accent-red)'}">
                                        ${isOnline ? 'RUNNING' : 'OFFLINE'}
                                    </span>
                                </div>
                                <div class="meta-item">
                                    <span class="meta-label">Max Slots</span>
                                    <span class="meta-value">${maxSlots} Cars</span>
                                </div>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;
            } catch (err) {
                console.error("Failed to fetch live ACCWeb servers:", err);
                if (!isBackground) {
                    const errMsg = err.name === "AbortError" 
                        ? "Connection timed out requesting ACCWeb data." 
                        : "Could not connect to ACCWeb instance API.";
                    container.innerHTML = `<div style="color: var(--accent-red);
